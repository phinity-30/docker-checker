# =============================================================================
# 🐳 DOCKPULSE (DOCKER-CHECKER) — PORTAINER STACK KONFIGURATION
# =============================================================================
# Anleitung für Portainer:
# 1. Öffne Portainer -> "Stacks" -> "+ Add stack"
# 2. Vergib einen Namen (z.B. "docker-checker")
# 3. Kopiere diesen gesamten Inhalt in den "Web editor"
# 4. Passe unten unter "SICHERHEIT & ANMELDUNG" deinen Benutzernamen & Passwort an!
# 5. Klicke unten auf "Deploy the stack"
# =============================================================================

services:
  docker-checker:
    # Baut das Image automatisch direkt aus deinem GitHub-Repository!
    build:
      context: https://github.com/phinity-30/docker-checker.git#main
      dockerfile: Dockerfile

    image: docker-checker:latest
    container_name: docker-checker

    # Neustart-Verhalten: "unless-stopped" | "always" | "on-failure" | "no"
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # 🌐 PORTS (Format: "HOST_PORT:CONTAINER_PORT")
    # -------------------------------------------------------------------------
    ports:
      - "3000:3000"   # Ändere links "3000", falls Port 3000 schon belegt ist (z.B. "8888:3000")

    # -------------------------------------------------------------------------
    # 💾 VOLUMES & SPEICHERPFADE
    # -------------------------------------------------------------------------
    volumes:
      # 1) Zugriff auf die Docker-Engine des Hosts (Pflicht für Live-Steuerung)
      - /var/run/docker.sock:/var/run/docker.sock

      # 2) Persistenter Speicher für deine zusammengeführten Container-Gruppen (groups.json)
      # Option A: Benanntes Docker-Volume (Empfohlen für Portainer)
      - docker_checker_data:/app/data
      # Option B: Fester Ordner auf dem Host (Alternative zu Option A):
      # - /opt/docker-checker/data:/app/data

    # -------------------------------------------------------------------------
    # ⚙️ UMGEBUNGSVARIABLEN (ALLE KONFIGURATIONSMÖGLICHKEITEN)
    # -------------------------------------------------------------------------
    environment:
      # --- 🔐 SICHERHEIT & ANMELDESEITE (LOGIN-SCHUTZ) ---
      - AUTH_ENABLED=true                   # "true" = Anmeldeseite aktiv | "false" = Ohne Login öffnen
      - AUTH_USER=admin                     # 👈 DEIN BENUTZERNAME für die Anmeldeseite
      - AUTH_PASS=MeinSicheresPasswort123!  # 👈 DEIN PASSWORT für die Anmeldeseite
      - SESSION_HOURS=24                    # Wie viele Stunden du nach dem Login angemeldet bleibst
      # - SESSION_SECRET=eigener_geheimer_schluessel_optional

      # --- Basis-Einstellungen ---
      - PORT=3000                           # Interner Server-Port im Container (Standard: 3000)
      - TZ=Europe/Berlin                    # Zeitzone für korrekte Log-Zeitstempel
      - NODE_ENV=production                 # Laufzeit-Modus (production | development)

      # --- UI & Anzeige-Optionen ---
      - APP_TITLE=DockPulse                 # Name oben links im Dashboard & auf der Login-Seite
      - DEFAULT_THEME=dark                  # Standard-Farbschema: "dark" oder "light"
      - DEFAULT_VIEW=stacks                 # Start-Ansicht nach Login: "stacks" | "all" | "groups"
      - AUTO_REFRESH_SECONDS=4              # Intervall der Live-Aktualisierung in Sekunden (Standard: 4)
      - LOG_TAIL_LINES=150                  # Anzahl der standardmäßig geladenen Log-Zeilen pro Container (Standard: 150)

      # --- Daten- & Docker-Verbindung ---
      - DATA_DIR=/app/data                  # Speicherort für eigene Gruppen im Container
      - DOCKER_SOCKET=/var/run/docker.sock  # Pfad zum gemounteten Docker-Socket
      - DEMO_MODE=false                     # Auf "true" setzen, um Test-/Demodaten statt echter Container zu zeigen

      # --- Optional: Remote Docker-Host über TCP / Socket-Proxy (statt lokalem Socket) ---
      # - DOCKER_HOST=tcp://192.168.1.100:2375

    # -------------------------------------------------------------------------
    # 🩺 HEALTHCHECK (Überwacht automatisch in Portainer, ob die App reagiert)
    # -------------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # -------------------------------------------------------------------------
    # 🛡️ OPTIONAL: RESSOURCEN-LIMITS (Bei Bedarf Kommentarzeichen # entfernen)
    # -------------------------------------------------------------------------
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.50"
    #       memory: 256M
    #     reservations:
    #       memory: 64M

    # -------------------------------------------------------------------------
    # 🏷️ LABELS
    # -------------------------------------------------------------------------
    labels:
      - "com.docker.compose.project=docker-checker"
      - "org.opencontainers.image.title=DockPulse Docker-Checker"
      - "org.opencontainers.image.source=https://github.com/phinity-30/docker-checker"
      - "com.centurylinklabs.watchtower.enable=false"

# =============================================================================
# 📦 PERSISTENTE VOLUMES
# =============================================================================
volumes:
  docker_checker_data:
    driver: local
